name: Process Study PDFs

on:
  push:
    paths:
      - 'pdfs/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Process new PDFs with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/process_pdf.py

      - name: Commit and push generated study assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/images/
          if git diff --staged --quiet; then
            echo "No changes in src/data/ or public/images/ to commit."
          else
            git commit -m "chore: process new study PDF(s) [skip ci]"
            git push
          fi
